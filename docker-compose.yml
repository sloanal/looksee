version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: looksee-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: looksee
    ports:
      - "5432:5432"
    volumes:
      - looksee-postgres-data:/var/lib/postgresql/data

volumes:
  looksee-postgres-data:
